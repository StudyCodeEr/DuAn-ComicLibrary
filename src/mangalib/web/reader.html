<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đang đọc · Comic Library</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="reader" data-chrome="shown">
<header class="topbar">
  <a class="brand" id="back" href="index.html" title="Về thư viện"></a>
  <div id="title" class="count reader-title"></div>
</header>

<main style="padding:0">
  <div class="pages" id="pages"></div>
</main>

<div class="readerbar">
  <button id="prev" class="ghost iconbtn" title="Chương trước (←)" aria-label="Chương trước"></button>
  <select id="chapters" style="max-width:38vw" aria-label="Chọn chương"></select>
  <button id="next" class="ghost iconbtn" title="Chương sau (→)" aria-label="Chương sau"></button>
  <span class="spacer"></span>
  <label class="pos" for="zoom">Cỡ</label>
  <input id="zoom" type="range" min="420" max="1600" step="20" value="900" style="width:110px">
  <button id="theme" class="ghost iconbtn" title="Sáng / tối" aria-label="Đổi sáng tối"></button>
  <span class="pos" id="pos"></span>
</div>

<script type="module" src="/static/js/reader.js"></script>
</body>
</html>
